name: pluggercat

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: pluggercat-bot:local
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    env_file:
      - ./.env
    environment:
      APP_NAME: ${APP_NAME:-pluggercat}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      DISCORD_DEV_GUILD_ID: ${DISCORD_DEV_GUILD_ID:-}
      LAVALINK_NODE_NAME: ${LAVALINK_NODE_NAME:-main}
      LAVALINK_ADDRESS: lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in .env}
      LAVALINK_SECURE: "false"
    depends_on:
      lavalink:
        condition: service_started
        restart: true
    networks:
      - backend

  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    restart: unless-stopped
    environment:
      API_TOKEN: ${YOUTUBE_REMOTE_CIPHER_PASSWORD:-pluggercat-yt-cipher}
    expose:
      - "8001"
    networks:
      - backend

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4-alpine
    restart: unless-stopped
    depends_on:
      yt-cipher:
        condition: service_started
    environment:
      _JAVA_OPTIONS: -Xms512M -Xmx512M
      SERVER_PORT: 2333
      SERVER_ADDRESS: 0.0.0.0
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:?set LAVALINK_PASSWORD in .env}
      LAVALINK_YOUTUBE_PLAYLIST_LOAD_LIMIT: ${LAVALINK_YOUTUBE_PLAYLIST_LOAD_LIMIT:-100}
      LAVASRC_ENABLE_SPOTIFY: ${LAVASRC_ENABLE_SPOTIFY:-false}
      LAVASRC_SPOTIFY_CLIENT_ID: ${LAVASRC_SPOTIFY_CLIENT_ID:-}
      LAVASRC_SPOTIFY_CLIENT_SECRET: ${LAVASRC_SPOTIFY_CLIENT_SECRET:-}
      LAVASRC_SPOTIFY_COUNTRY_CODE: ${LAVASRC_SPOTIFY_COUNTRY_CODE:-US}
      LAVASRC_SPOTIFY_PLAYLIST_PAGE_LIMIT: ${LAVASRC_SPOTIFY_PLAYLIST_PAGE_LIMIT:-6}
      LAVASRC_SPOTIFY_ALBUM_PAGE_LIMIT: ${LAVASRC_SPOTIFY_ALBUM_PAGE_LIMIT:-6}
      LAVASRC_SPOTIFY_PREFER_ANONYMOUS_TOKEN: ${LAVASRC_SPOTIFY_PREFER_ANONYMOUS_TOKEN:-false}
      LAVASRC_SPOTIFY_CUSTOM_TOKEN_ENDPOINT: ${LAVASRC_SPOTIFY_CUSTOM_TOKEN_ENDPOINT:-}
      LAVASRC_ENABLE_APPLE_MUSIC: ${LAVASRC_ENABLE_APPLE_MUSIC:-false}
      LAVASRC_APPLE_MUSIC_COUNTRY_CODE: ${LAVASRC_APPLE_MUSIC_COUNTRY_CODE:-US}
      LAVASRC_APPLE_MUSIC_MEDIA_API_TOKEN: ${LAVASRC_APPLE_MUSIC_MEDIA_API_TOKEN:-}
      LAVASRC_APPLE_MUSIC_PLAYLIST_PAGE_LIMIT: ${LAVASRC_APPLE_MUSIC_PLAYLIST_PAGE_LIMIT:-6}
      LAVASRC_APPLE_MUSIC_ALBUM_PAGE_LIMIT: ${LAVASRC_APPLE_MUSIC_ALBUM_PAGE_LIMIT:-6}
      LAVASRC_ENABLE_DEEZER: ${LAVASRC_ENABLE_DEEZER:-false}
      LAVASRC_DEEZER_MASTER_DECRYPTION_KEY: ${LAVASRC_DEEZER_MASTER_DECRYPTION_KEY:-}
      LAVASRC_DEEZER_ARL: ${LAVASRC_DEEZER_ARL:-}
      YOUTUBE_POT_TOKEN: ${YOUTUBE_POT_TOKEN:-}
      YOUTUBE_VISITOR_DATA: ${YOUTUBE_VISITOR_DATA:-}
      YOUTUBE_OAUTH_ENABLED: ${YOUTUBE_OAUTH_ENABLED:-false}
      YOUTUBE_OAUTH_REFRESH_TOKEN: ${YOUTUBE_OAUTH_REFRESH_TOKEN:-}
      YOUTUBE_OAUTH_SKIP_INITIALIZATION: ${YOUTUBE_OAUTH_SKIP_INITIALIZATION:-false}
      YOUTUBE_REMOTE_CIPHER_URL: ${YOUTUBE_REMOTE_CIPHER_URL:-http://yt-cipher:8001}
      YOUTUBE_REMOTE_CIPHER_PASSWORD: ${YOUTUBE_REMOTE_CIPHER_PASSWORD:-pluggercat-yt-cipher}
      YOUTUBE_REMOTE_CIPHER_USER_AGENT: ${YOUTUBE_REMOTE_CIPHER_USER_AGENT:-pluggercat}
    volumes:
      - ./deploy/lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "127.0.0.1:2333:2333"
    expose:
      - "2333"
    networks:
      - backend

networks:
  backend:
    driver: bridge
