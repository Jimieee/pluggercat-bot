server:
  port: 2333
  address: 0.0.0.0
  http2:
    enabled: false

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.1"
      snapshot: false
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false
  server:
    password: "override-me-with-LAVALINK_SERVER_PASSWORD"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: false
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    nonAllocatingFrameBuffer: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    youtubePlaylistLoadLimit: ${LAVALINK_YOUTUBE_PLAYLIST_LOAD_LIMIT:100}
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    timeouts:
      connectTimeoutMs: 3000
      connectionRequestTimeoutMs: 3000
      socketTimeoutMs: 3000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - WEB
      - TV
    clientOptions:
      WEB:
        playback: false
      TV:
        searching: false
        playlistLoading: false
    remoteCipher:
      url: "${YOUTUBE_REMOTE_CIPHER_URL:http://yt-cipher:8001}"
      password: "${YOUTUBE_REMOTE_CIPHER_PASSWORD:pluggercat-yt-cipher}"
      userAgent: "${YOUTUBE_REMOTE_CIPHER_USER_AGENT:pluggercat}"
    pot:
      token: "${YOUTUBE_POT_TOKEN:}"
      visitorData: "${YOUTUBE_VISITOR_DATA:}"
    oauth:
      enabled: ${YOUTUBE_OAUTH_ENABLED:false}
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: ${YOUTUBE_OAUTH_SKIP_INITIALIZATION:false}
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
    sources:
      spotify: ${LAVASRC_ENABLE_SPOTIFY:false}
      applemusic: ${LAVASRC_ENABLE_APPLE_MUSIC:false}
      deezer: ${LAVASRC_ENABLE_DEEZER:false}
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    spotify:
      clientId: "${LAVASRC_SPOTIFY_CLIENT_ID:}"
      clientSecret: "${LAVASRC_SPOTIFY_CLIENT_SECRET:}"
      countryCode: "${LAVASRC_SPOTIFY_COUNTRY_CODE:US}"
      playlistLoadLimit: ${LAVASRC_SPOTIFY_PLAYLIST_PAGE_LIMIT:6}
      albumLoadLimit: ${LAVASRC_SPOTIFY_ALBUM_PAGE_LIMIT:6}
      resolveArtistsInSearch: true
      localFiles: false
      preferAnonymousToken: ${LAVASRC_SPOTIFY_PREFER_ANONYMOUS_TOKEN:false}
      customTokenEndpoint: "${LAVASRC_SPOTIFY_CUSTOM_TOKEN_ENDPOINT:}"
    applemusic:
      countryCode: "${LAVASRC_APPLE_MUSIC_COUNTRY_CODE:US}"
      mediaAPIToken: "${LAVASRC_APPLE_MUSIC_MEDIA_API_TOKEN:}"
      playlistLoadLimit: ${LAVASRC_APPLE_MUSIC_PLAYLIST_PAGE_LIMIT:6}
      albumLoadLimit: ${LAVASRC_APPLE_MUSIC_ALBUM_PAGE_LIMIT:6}
    deezer:
      masterDecryptionKey: "${LAVASRC_DEEZER_MASTER_DECRYPTION_KEY:}"
      arl: "${LAVASRC_DEEZER_ARL:}"
      formats:
        - "MP3_320"
        - "MP3_128"

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

logging:
  level:
    root: INFO
    lavalink: INFO
